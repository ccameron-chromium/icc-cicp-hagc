<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PQ HDR: JPEG vs PNG cICP / iCCP</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #fff;
    color: #111;
    font-family: system-ui, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .grid {
    flex: 1;
    min-height: 0;
    display: grid;
    gap: 8px;
    padding: 8px;
    /* Landscape screens: one row of four (images are portrait). */
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 1fr;
  }
  /* Portrait / narrow screens: 2x2. */
  @media (max-aspect-ratio: 3/2) {
    .grid {
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
    }
  }
  figure {
    margin: 0;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #f2f2f2;
    border-radius: 6px;
    overflow: hidden;
  }
  figcaption {
    padding: 6px 8px;
    font-size: 14px;
    text-align: center;
    flex: none;
  }
  figcaption .fmt { font-weight: 600; }
  figcaption .tags { opacity: 0.7; }
  code {
    background: #e2e2e2;
    padding: 1px 4px;
    border-radius: 3px;
  }
  img {
    flex: 1;
    min-height: 0;
    width: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>
<div class="grid">
  <figure>
    <figcaption>
      <span class="fmt">JPEG</span><br>
      <span class="tags">bmw-pq.jpg</span>
    </figcaption>
    <img src="bmw-pq.jpg" alt="JPEG">
  </figure>
  <figure>
    <figcaption>
      <span class="fmt">PNG</span> &mdash; <code>cICP</code> only<br>
      <span class="tags">bmw-pq-cICP.png</span>
    </figcaption>
    <img src="bmw-pq-cICP.png" alt="PNG with cICP">
  </figure>
  <figure>
    <figcaption>
      <span class="fmt">PNG</span> &mdash; <code>iCCP</code> only<br>
      <span class="tags">bmw-pq-iCCP.png</span>
    </figcaption>
    <img src="bmw-pq-iCCP.png" alt="PNG with iCCP">
  </figure>
  <figure>
    <figcaption>
      <span class="fmt">PNG</span> &mdash; <code>cICP</code> + <code>iCCP</code><br>
      <span class="tags">bmw-pq-cICP-and-iCCP.png</span>
    </figcaption>
    <img src="bmw-pq-cICP-and-iCCP.png" alt="PNG with cICP and iCCP">
  </figure>
</div>
</body>
</html>
