<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PQ HDR: JPEG vs PNG cICP / iCCP</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
  }
  .grid {
    display: grid;
    height: 100vh;
    gap: 8px;
    padding: 8px;
    /* Landscape screens: 4x2 (JPEG + PNGs on top, AVIFs below). */
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
  }
  /* Portrait / narrow screens: 3x3. */
  @media (max-aspect-ratio: 1/1) {
    .grid {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
    }
  }
  figure {
    margin: 0;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #1c1c1c;
    border-radius: 6px;
    overflow: hidden;
  }
  figcaption {
    padding: 6px 8px;
    font-size: 14px;
    text-align: center;
    flex: none;
  }
  figcaption .fmt { font-weight: 600; }
  figcaption .tags { opacity: 0.8; }
  figcaption code {
    background: #333;
    padding: 1px 4px;
    border-radius: 3px;
  }
  img {
    flex: 1;
    min-height: 0;
    width: 100%;
    object-fit: contain;
  }
  :root { dynamic-range-limit: no-limit; }
  :root.limit-standard { dynamic-range-limit: standard; }
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 14px;
  }
  .controls button {
    font: inherit;
    font-size: 16px;
    padding: 10px 18px;
    border-radius: 6px;
    border: 1px solid #555;
    background: #2a2a2a;
    color: #eee;
    cursor: pointer;
  }
  .controls button:hover { background: #3a3a3a; }
  .controls code {
    background: #333;
    padding: 1px 4px;
    border-radius: 3px;
  }
</style>
</head>
<body>
<div class="grid">
  <figure>
    <figcaption>
      <span class="fmt">JPEG</span><br>
      <span class="tags">bmw-pq.jpg</span>
    </figcaption>
    <img src="bmw-pq.jpg" alt="JPEG">
  </figure>
  <figure>
    <figcaption>
      <span class="fmt">PNG</span> &mdash; <code>cICP</code> only<br>
      <span class="tags">bmw-pq-cICP.png</span>
    </figcaption>
    <img src="bmw-pq-cICP.png" alt="PNG with cICP">
  </figure>
  <figure>
    <figcaption>
      <span class="fmt">PNG</span> &mdash; <code>iCCP</code> only<br>
      <span class="tags">bmw-pq-iCCP.png</span>
    </figcaption>
    <img src="bmw-pq-iCCP.png" alt="PNG with iCCP">
  </figure>
  <figure>
    <figcaption>
      <span class="fmt">PNG</span> &mdash; <code>cICP</code> + <code>iCCP</code><br>
      <span class="tags">bmw-pq-cICP-and-iCCP.png</span>
    </figcaption>
    <img src="bmw-pq-cICP-and-iCCP.png" alt="PNG with cICP and iCCP">
  </figure>
  <figure>
    <figcaption>
      <span class="fmt">AVIF</span> &mdash; <code>nclx</code> (BT.2020 / PQ) only<br>
      <span class="tags">bmw-pq-nclx.avif</span>
    </figcaption>
    <img src="bmw-pq-nclx.avif" alt="AVIF with nclx">
  </figure>
  <figure>
    <figcaption>
      <span class="fmt">AVIF</span> &mdash; <code>nclx</code> (BT.2020 / PQ) + ICC<br>
      <span class="tags">bmw-pq-nclx-icc.avif</span>
    </figcaption>
    <img src="bmw-pq-nclx-icc.avif" alt="AVIF with nclx and ICC">
  </figure>
  <figure>
    <figcaption>
      <span class="fmt">AVIF</span> &mdash; <code>nclx</code> (unspecified) + ICC<br>
      <span class="tags">bmw-pq-nclx-unspecified-icc.avif</span>
    </figcaption>
    <img src="bmw-pq-nclx-unspecified-icc.avif" alt="AVIF with unspecified nclx and ICC">
  </figure>
  <div class="controls">
    <div><code>dynamic-range-limit</code>: <code id="drl-value">no-limit</code></div>
    <button id="drl-toggle" type="button">Switch to standard</button>
  </div>
</div>
<script>
  const root = document.documentElement;
  const btn = document.getElementById('drl-toggle');
  const value = document.getElementById('drl-value');
  btn.addEventListener('click', () => {
    const standard = root.classList.toggle('limit-standard');
    value.textContent = standard ? 'standard' : 'no-limit';
    btn.textContent = standard ? 'Switch to no-limit' : 'Switch to standard';
  });
</script>
</body>
</html>
